<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - BuySellU</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .profile-box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="profile-box">

    <h2>👤 My Profile</h2>

    <label>📷 Profile Photo</label>
    <input id="profilePhoto" type="file" accept="image/*">

    <img id="profilePreview"
      style="display:none; width:100px; height:100px; object-fit:cover; border-radius:50%; margin-top:10px;">

    <input id="profileName" type="text" placeholder="Your Name">

    <input id="profileLocation" type="text" placeholder="Your Location">

    <input id="profileAddress" type="text" placeholder="Your Address">

    <input id="profilePhone" type="tel" placeholder="Your Phone Number">

    <input id="profileEmail" type="email" placeholder="Your Email">

    <button onclick="saveProfile()">
      💾 Save Profile
    </button>

    <button onclick="window.location.href='index.html'">
      🏠 Back to Home
    </button>

  </div>

<script>

document.getElementById("profilePhoto").addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (file) {

    const reader = new FileReader();

    reader.onload = function(e) {

      const preview = document.getElementById("profilePreview");

      preview.src = e.target.result;
      preview.style.display = "block";

    };

    reader.readAsDataURL(file);
  }

});


function saveProfile() {
  const name = document.getElementById("profileName").value;
  const location = document.getElementById("profileLocation").value;
  const address = document.getElementById("profileAddress").value;
  const phone = document.getElementById("profilePhone").value;
  const email = document.getElementById("profileEmail").value.trim().toLowerCase();

  const preview = document.getElementById("profilePreview");

  if (!email) {
    alert("Please login first.");
    return;
  }

  const profileData = {
    name: name,
    location: location,
    address: address,
    phone: phone,
    email: email,
    photo: ""
  };

  if (preview.src && preview.style.display !== "none") {
    profileData.photo = preview.src;
  }

  localStorage.setItem("buyselluProfile_" + email, JSON.stringify(profileData));

  alert("Profile saved successfully! ✅");
}

</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCXE8VXsK9olIImXh_XdvXVqXt-IKzaqRk",
  authDomain: "buysellu-d4db0.firebaseapp.com",
  projectId: "buysellu-d4db0",
  storageBucket: "buysellu-d4db0.firebasestorage.app",
  messagingSenderId: "585565834703",
  appId: "1:585565834703:web:724ad291b435df758356ba",
  measurementId: "G-JSV2BLP6HL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

setPersistence(auth, browserLocalPersistence).then(() => {
onAuthStateChanged(auth, (user) => {

  if (user && user.email) {

    const email = user.email.trim().toLowerCase();

    const savedProfile = localStorage.getItem("buyselluProfile_" + email);

    if (savedProfile) {

      const profileData = JSON.parse(savedProfile);

      document.getElementById("profileName").value = profileData.name || "";
      document.getElementById("profileLocation").value = profileData.location || "";
      document.getElementById("profileAddress").value = profileData.address || "";
      document.getElementById("profilePhone").value = profileData.phone || "";
      document.getElementById("profileEmail").value = email;

      if (profileData.photo) {
        const preview = document.getElementById("profilePreview");
        preview.src = profileData.photo;
        preview.style.display = "block";
      }

    } else {

      document.getElementById("profileEmail").value = email;

    }

    document.getElementById("profileEmail").readOnly = true;

  }

});
});
</script>
</body>
</html>
