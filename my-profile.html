<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - BuySellU</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .profile-box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="profile-box">

    <h2>👤 My Profile</h2>

    <label>📷 Profile Photo</label>
    <input id="profilePhoto" type="file" accept="image/*">

    <img id="profilePreview"
      style="display:none; width:100px; height:100px; object-fit:cover; border-radius:50%; margin-top:10px;">

    <input id="profileName" type="text" placeholder="Your Name">

    <input id="profileLocation" type="text" placeholder="Your Location">

    <input id="profileAddress" type="text" placeholder="Your Address">

    <input id="profilePhone" type="tel" placeholder="Your Phone Number">

    <input id="profileEmail" type="email" placeholder="Your Email">

    <button onclick="saveProfile()">
      💾 Save Profile
    </button>

    <button onclick="window.location.href='index.html'">
      🏠 Back to Home
    </button>

  </div>

<script>

const savedPhoto = localStorage.getItem("buyselluProfilePhoto");

if (savedPhoto) {
  document.getElementById("profilePreview").src = savedPhoto;
  document.getElementById("profilePreview").style.display = "block";
}

document.getElementById("profileName").value =
  localStorage.getItem("buyselluProfileName") || "";

document.getElementById("profileLocation").value =
  localStorage.getItem("buyselluProfileLocation") || "";

document.getElementById("profileAddress").value =
  localStorage.getItem("buyselluProfileAddress") || "";

document.getElementById("profilePhone").value =
  localStorage.getItem("buyselluProfilePhone") || "";

document.getElementById("profileEmail").value =
  localStorage.getItem("buyselluProfileEmail") || "";


document.getElementById("profilePhoto").addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (file) {

    const reader = new FileReader();

    reader.onload = function(e) {

      const preview = document.getElementById("profilePreview");

      preview.src = e.target.result;
      preview.style.display = "block";

    };

    reader.readAsDataURL(file);
  }

});


function saveProfile() {

  const name = document.getElementById("profileName").value;
  const location = document.getElementById("profileLocation").value;
  const address = document.getElementById("profileAddress").value;
  const phone = document.getElementById("profilePhone").value;
  const email = document.getElementById("profileEmail").value;

  const preview = document.getElementById("profilePreview");

  if (preview.src && preview.style.display !== "none") {
    localStorage.setItem("buyselluProfilePhoto", preview.src);
  }

  localStorage.setItem("buyselluProfileName", name);
  localStorage.setItem("buyselluProfileLocation", location);
  localStorage.setItem("buyselluProfileAddress", address);
  localStorage.setItem("buyselluProfilePhone", phone);
  localStorage.setItem("buyselluProfileEmail", email);

  alert("Profile saved successfully! ✅");
}

</script>

</body>
</html>
