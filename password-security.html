<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuySellU - Password & Security</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff0f7;
  color:#222;
}

.header{
  background:#ec4899;
  color:white;
  padding:25px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:8px 0 0;
  font-size:15px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px 15px;
}

.security-card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.security-card h3{
  margin-top:0;
}

.security-card input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

.security-card button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#ec4899;
  color:white;
  font-size:16px;
  margin-top:10px;
}

.back{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#ec4899;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<div class="header">
<h1>BuySellU</h1>
<p>Password & Security</p>
</div>

<div class="container">

<div class="security-card">

<h3>🔐 Change Password</h3>

<input type="password" id="oldPassword" placeholder="Current Password">

<input type="password" id="newPassword" placeholder="New Password">

<input type="password" id="confirmPassword" placeholder="Confirm New Password">

<button onclick="changePassword()">
Change Password
</button>

</div>

<div class="security-card">

<h3>🛡️ Security</h3>

<p>🔒 Keep your password private and secure.</p>

<p>📱 Do not share your password with anyone.</p>

</div>

<button class="back" onclick="window.location.href='settings.html'">
← Back to Settings
</button>

</div>

<script>

function changePassword(){

const oldPassword =
document.getElementById("oldPassword").value;

const newPassword =
document.getElementById("newPassword").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

const savedPassword =
localStorage.getItem("buyselluPassword");

if(newPassword === "" || confirmPassword === ""){
alert("Please enter your new password.");
return;
}

if(newPassword !== confirmPassword){
alert("New passwords do not match.");
return;
}

if(savedPassword !== null && oldPassword !== savedPassword){
alert("Current password is incorrect.");
return;
}

localStorage.setItem("buyselluPassword",newPassword);

alert("Password changed successfully!");

document.getElementById("oldPassword").value="";
document.getElementById("newPassword").value="";
document.getElementById("confirmPassword").value="";

}

</script>

</body>
</html>
