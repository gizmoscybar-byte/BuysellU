<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuySellU - Sold Out</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

.header{
  background:#ec4899;
  background:#ff6a00;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:8px 0 0;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px 15px;
}

.sold-title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:20px;
}

.sold-card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.sold-card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.sold-info{
  padding:16px;
}

.sold-info h2{
  margin:0 0 8px;
  font-size:22px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.sold-badge{
  display:inline-block;
  background:#ff3d00;
  color:white;
  padding:8px 14px;
  border-radius:20px;
  font-weight:bold;
}

.empty{
  background:white;
  padding:30px 20px;
  text-align:center;
  border-radius:16px;
  color:#666;
}

.back{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:17px;
}
</style>
</head>

<body>

<div class="header">
  <h1>BuySellU</h1>
  <p>Sold Out Products</p>
</div>

<div class="container">

  <div class="sold-title">🔴 Sold Out</div>

  <div id="soldProducts"></div>

  <button class="back" onclick="window.location.href='account.html'">
    ← Back to Account
  </button>

</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  initializeAuth,
  browserLocalPersistence,
  browserPopupRedirectResolver,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyCXE8VXsK9oI1mXh_XdvXVqXt-IKzaqRk",
  authDomain: "buysellu-d4db0.firebaseapp.com",
  projectId: "buysellu-d4db0",
  storageBucket: "buysellu-d4db0.firebasestorage.app",
  messagingSenderId: "585565834703",
  appId: "1:585565834703:web:724d291b435df758356ba",
  measurementId: "G-JSV2BLP6HL"
};


const app = initializeApp(firebaseConfig);

const auth = initializeAuth(app, {
  persistence: browserLocalPersistence,
  popupRedirectResolver: browserPopupRedirectResolver
});
onAuthStateChanged(auth, (user) => {

  const box = document.getElementById("soldProducts");
if (localStorage.getItem("buyselluLoggedIn") !== "true") {

    box.innerHTML = `
      <div class="empty">
        <h2>🔒 Login First</h2>
        <p>Please login to view your sold products.</p>

        <button onclick="window.location.href='account.html'">
          Login
        </button>
      </div>
    `;

    return;
  }


  const listings =
    JSON.parse(localStorage.getItem("buyselluListings")) || [];


  const soldProducts =
    listings.filter(item => item.sold === true);


  if (soldProducts.length === 0) {

    box.innerHTML = `
      <div class="empty">
        <h2>No Sold Products</h2>
        <p>Abhi koi product sold nahi hua.</p>
      </div>
    `;

    return;
  }


  soldProducts.forEach(item => {

    const card = document.createElement("div");

    card.className = "sold-card";

    card.innerHTML = `
      ${item.image ? `<img src="${item.image}">` : ""}

      <div class="sold-info">

        <h2>${item.name || "Product"}</h2>

        <div class="price">
          ₹${item.price || "0"}
        </div>

        <p>
          Category:
          ${item.category || "Not specified"}
        </p>

        <p>
          📍 ${item.location || "Location not specified"}
        </p>

        <span class="sold-badge">
          🔴 SOLD OUT
        </span>

      </div>
    `;

    box.appendChild(card);

  });

});

</script>


</body>
</html>
