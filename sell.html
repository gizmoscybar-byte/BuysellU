<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sell Something - BuySellU</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:22px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:7px 0 0;
  color:#ccc;
}

.sell-box{
  max-width:600px;
  margin:25px auto;
  padding:20px;
  background:white;
  border-radius:15px;
}

.sell-box input,
.sell-box textarea,
.sell-box select{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}

.photo-btn{
  display:block;
  padding:14px;
  margin-top:10px;
  background:#f1f1f1;
  border-radius:9px;
  text-align:center;
  cursor:pointer;
}

#preview{
  display:none;
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
}

button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  background:#111;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<header>
  <h1>BuySellU</h1>
  <p>Sell Your Product</p>
</header>

<div class="sell-box">

  <h2>📦 Sell Something</h2>

  <input id="productName"
    type="text"
    placeholder="Product name">

  <select id="category">
    <option value="">Select category</option>
    <option>Mobiles</option>
    <option>Electronics</option>
    <option>Cars</option>
    <option>Bikes</option>
    <option>Fashion</option>
    <option>Home</option>
  </select>

  <input id="price"
    type="number"
    placeholder="Price">

  <input id="location"
    type="text"
    placeholder="Location">

  <textarea id="description"
    rows="5"
    placeholder="Describe your product"></textarea>

  <label for="photo" class="photo-btn">
    📷 Add Product Photo
  </label>

  <input id="photo"
    type="file"
    accept="image/*"
    style="display:none;">

  <img id="preview">

  <button onclick="postListing()">
    📤 Post Listing
  </button>

  <button onclick="window.location.href='index.html'">
    🏠 Back to Home
  </button>

</div>

<script>

document.getElementById("photo").addEventListener("change", function(event){

  const file = event.target.files[0];

  if(file){

    const reader = new FileReader();

    reader.onload = function(e){

      const preview = document.getElementById("preview");

      preview.src = e.target.result;
      preview.style.display = "block";

    };

    reader.readAsDataURL(file);
  }

});


function postListing(){

  const name =
    document.getElementById("productName").value.trim();

  const category =
    document.getElementById("category").value;

  const price =
    document.getElementById("price").value;

  const location =
    document.getElementById("location").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const photo =
    document.getElementById("photo").files[0];


  if(!name || !category || !price || !location){

    alert("Please fill all required details.");

    return;
  }


  const saveListing = (image="") => {

    let listings =
      JSON.parse(
        localStorage.getItem("buyselluListings")
      ) || [];


    listings.unshift({

      name:name,
      category:category,
      price:price,
      location:location,
      description:description,
      image:image

    });


    localStorage.setItem(
      "buyselluListings",
      JSON.stringify(listings)
    );


    alert("Listing posted successfully! ✅");

    window.location.href="index.html";

  };


  if(photo){

    const reader = new FileReader();

    reader.onload = function(e){

      const img = new Image();

      img.onload = function(){

        const canvas =
          document.createElement("canvas");

        const maxWidth = 800;

        const scale =
          Math.min(1, maxWidth / img.width);

        canvas.width =
          img.width * scale;

        canvas.height =
          img.height * scale;


        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const compressedImage =
          canvas.toDataURL(
            "image/jpeg",
            0.7
          );


        saveListing(compressedImage);

      };

      img.src=e.target.result;

    };

    reader.readAsDataURL(photo);

  }else{

    saveListing();

  }

}

</script>

</body>
</html>
