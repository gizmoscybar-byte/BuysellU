<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuySellU - Product Details</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff3e8;
}

.header{
  background:#f97316;
  color:white;
  padding:18px;
  text-align:center;
}

.container{
  max-width:700px;
  margin:20px auto;
  padding:15px;
}

.product-card{
  background:white;
  border-radius:15px;
  padding:20px;
}

.product-image{
  width:100%;
  max-height:400px;
  object-fit:contain;
  border-radius:12px;
}

.price{
  font-size:28px;
  font-weight:bold;
  margin:15px 0;
}

.location{
  color:#555;
  font-size:16px;
}

.seller{
  border-top:1px solid #ddd;
  margin-top:20px;
  padding-top:20px;
}

.seller-photo{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  vertical-align:middle;
  margin-right:10px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

.favorite-btn{
  background:#111;
  color:white;
  border:1px solid #ff3d00;
  font-size:18px;
}

.chat-btn{
  background:#111;
  color:white;
}

.call-btn{
  background:#eee;
  color:#111;
}

.back-btn{
  background:white;
  border:1px solid #ddd;
}

.more-title{
  margin-top:30px;
  font-size:25px;
}

.more-products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.more-card{
  background:#111;
  color:white;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
}

.more-card img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.more-info{
  padding:10px;
}

.more-info h3{
  margin:0 0 8px;
  font-size:17px;
}

.more-price{
  font-size:19px;
  font-weight:bold;
  color:#ff6a00;
}
</style>
</head>

<body>

<div class="header">
  <h1>BuySellU</h1>
  <p>Product Details</p>
</div>

<div class="container">

<div class="product-card">

<div id="productImages"></div>

<button id="favoriteBtn" class="favorite-btn" onclick="toggleFavorite()">
♡ Add to Favourite
</button>

<h2 id="productName">Product</h2>

<div id="productPrice" class="price"></div>

<p id="productCategory"></p>

<p id="productLocation" class="location"></p>

<p id="productDescription"></p>

<div class="seller">
<button id="soldBtn" onclick="markAsSold()" style="
width:100%;
padding:14px;
margin:10px 0;
border:1px solid #ff3d00;
border-radius:12px;
background:#ff3d00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
">
✓ Mark as Sold
</button>
<h3>👤 Seller</h3>

<div>
<img id="sellerPhoto" class="seller-photo" style="display:none;">
<b id="sellerName">Seller</b>
</div>

<button class="chat-btn" onclick="openChat()">
💬 Chat with Seller
</button>

<button class="call-btn" onclick="callSeller()">
📞 Call Seller
</button>

</div>

<button class="back-btn" onclick="window.location.href='index.html'">
← Back to Home
</button>

</div>

<h2 class="more-title">More Products</h2>

<div id="moreProducts" class="more-products"></div>

</div>

<script>

const product = JSON.parse(
  localStorage.getItem("buyselluSelectedProduct") || "null"
);

if(product){
if(product.sold === true){
  document.getElementById("soldBtn").style.display = "none";

  const soldInfo = document.createElement("div");
  soldInfo.innerHTML = "🔴 SOLD OUT";
  soldInfo.style.cssText =
    "background:#ff3d00;color:white;padding:14px;text-align:center;border-radius:12px;font-size:20px;font-weight:bold;margin-bottom:15px;";

  document.querySelector(".product-card").insertBefore(
    soldInfo,
    document.getElementById("productName")
  );

  document.querySelector(".chat-btn").style.display = "none";
  document.querySelector(".call-btn").style.display = "none";
}
  document.getElementById("productName").innerText =
    product.name || "Product";

  document.getElementById("productPrice").innerText =
    "₹" + (product.price || "0");

  document.getElementById("productCategory").innerText =
    "Category: " + (product.category || "Not specified");

  document.getElementById("productLocation").innerText =
    "📍 " + (product.location || "Location not specified");

  document.getElementById("productDescription").innerText =
    product.description || "No description available.";

if(product.images && product.images.length){

  const box = document.getElementById("productImages");

  box.style.position = "relative";
  box.style.width = "100%";
  box.style.overflow = "hidden";
  box.style.borderRadius = "12px";

  const slider = document.createElement("div");

  slider.style.display = "flex";
  slider.style.transition = "transform 0.3s ease";
  slider.style.width = (product.images.length * 100) + "%";

  product.images.forEach(function(src){

    const image = document.createElement("img");

    image.src = src;

    image.style.width = (100 / product.images.length) + "%";
    image.style.maxHeight = "400px";
    image.style.objectFit = "contain";
    image.style.flexShrink = "0";

    slider.appendChild(image);

  });

  box.appendChild(slider);
const counter = document.createElement("div");

counter.innerText = "1 / " + product.images.length;

counter.style.position = "absolute";
counter.style.bottom = "10px";
counter.style.left = "50%";
counter.style.transform = "translateX(-50%)";
counter.style.background = "rgba(0,0,0,0.6)";
counter.style.color = "white";
counter.style.padding = "5px 12px";
counter.style.borderRadius = "20px";
counter.style.fontSize = "14px";
counter.style.zIndex = "10";

box.appendChild(counter);
  let current = 0;
  let startX = 0;

  box.addEventListener("touchstart", function(e){
    startX = e.touches[0].clientX;
  });

  box.addEventListener("touchend", function(e){

    const endX = e.changedTouches[0].clientX;
    const difference = startX - endX;

    if(Math.abs(difference) > 50){

      if(difference > 0 && current < product.images.length - 1){
        current++;
      }

      if(difference < 0 && current > 0){
        current--;
      }

      slider.style.transform =
"translateX(-" + (current * (100 / product.images.length)) + "%)";
      counter.innerText = (current + 1) + " / " + product.images.length;
    }

  });

}
else if(product.image){

  const box = document.getElementById("productImages");

  const image = document.createElement("img");

  image.src = product.image;

  image.style.width = "100%";
  image.style.maxHeight = "400px";
  image.style.objectFit = "contain";
  image.style.borderRadius = "12px";

  box.appendChild(image);

}
}
/* Seller */

const sellerName =
  localStorage.getItem("buyselluProfileName") ||
  "Unknown Seller";

const sellerPhoto =
  localStorage.getItem("buyselluProfilePhoto") ||
  "";

document.getElementById("sellerName").innerText =
  sellerName;

if(sellerPhoto){

  const photo =
    document.getElementById("sellerPhoto");

  photo.src = sellerPhoto;
  photo.style.display = "inline-block";
}


/* Favourite */

function toggleFavorite(){

  if(!product){
    return;
  }

  let favorites =
    JSON.parse(
      localStorage.getItem("buyselluFavorites") || "[]"
    );

  const index =
    favorites.findIndex(item =>
      JSON.stringify(item) === JSON.stringify(product)
    );

  if(index === -1){

    favorites.push(product);

    document.getElementById("favoriteBtn").innerHTML =
      "❤️ Favourite";

  }else{

    favorites.splice(index,1);

    document.getElementById("favoriteBtn").innerHTML =
      "♡ Add to Favourite";
  }

  localStorage.setItem(
    "buyselluFavorites",
    JSON.stringify(favorites)
  );
}


/* Favourite button status */

if(product){

  const favorites =
    JSON.parse(
      localStorage.getItem("buyselluFavorites") || "[]"
    );

  const isFavorite =
    favorites.some(item =>
      JSON.stringify(item) === JSON.stringify(product)
    );

  if(isFavorite){

    document.getElementById("favoriteBtn").innerHTML =
      "❤️ Favourite";
  }
}


/* Chat */

function openChat(){

  localStorage.setItem(
    "buyselluChatSellerName",
    sellerName
  );

  localStorage.setItem(
    "buyselluChatSellerPhoto",
    sellerPhoto
  );

  window.location.href="chat.html";
}


/* Call */

function callSeller(){

  alert(
    "Call feature will be connected with seller phone number next."
  );
}


/* More Products */

function showMoreProducts(){

  const allListings =
    JSON.parse(
      localStorage.getItem("buyselluListings") || "[]"
    );

  const box =
    document.getElementById("moreProducts");

  box.innerHTML = "";

  const otherProducts =
    allListings
    .filter(item =>
      JSON.stringify(item) !== JSON.stringify(product)
    )
    .slice(0,4);

  otherProducts.forEach(item => {

    const card =
      document.createElement("div");

    card.className="more-card";

    card.onclick=function(){

      localStorage.setItem(
        "buyselluSelectedProduct",
        JSON.stringify(item)
      );

      window.location.href =
        "product.html";
    };

    card.innerHTML = `

      ${
        item.image
        ? `<img src="${item.image}">`
        : ""
      }

      <div class="more-info">

        <h3>${item.name || "Product"}</h3>

        <div class="more-price">
          ₹${item.price || "0"}
        </div>

      </div>
    `;

    box.appendChild(card);
  });
}

showMoreProducts();
function markAsSold() {

  if (!product) return;

  const confirmBox = document.createElement("div");

  confirmBox.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
  `;

  confirmBox.innerHTML = `
    <div style="
      background:white;
      width:85%;
      max-width:360px;
      padding:25px;
      border-radius:18px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    ">

      <h2 style="margin-top:0;">Mark as Sold?</h2>

      <p style="font-size:16px;">
        Are you sure you want to mark this product as SOLD?
      </p>

      <div style="
        display:flex;
        gap:12px;
        margin-top:20px;
      ">

        <button id="soldNo" style="
          flex:1;
          padding:14px;
          border:1px solid #ddd;
          border-radius:12px;
          background:#eee;
          color:#111;
          font-size:17px;
          font-weight:bold;
        ">
          No
        </button>

        <button id="soldYes" style="
          flex:1;
          padding:14px;
          border:0;
          border-radius:12px;
          background:#ff3d00;
          color:white;
          font-size:17px;
          font-weight:bold;
        ">
          Yes
        </button>

      </div>
    </div>
  `;

  document.body.appendChild(confirmBox);

  document.getElementById("soldNo").onclick = function() {
    confirmBox.remove();
  };

  document.getElementById("soldYes").onclick = function() {

    confirmBox.remove();

    let listings =
      JSON.parse(localStorage.getItem("buyselluListings")) || [];

    listings = listings.map(item => {

      if (
        item.name === product.name &&
        item.price === product.price &&
        item.image === product.image
      ) {
        item.sold = true;
      }

      return item;
    });

    product.sold = true;

    localStorage.setItem(
      "buyselluListings",
      JSON.stringify(listings)
    );

    localStorage.setItem(
      "buyselluSelectedProduct",
      JSON.stringify(product)
    );

    document.getElementById("soldBtn").style.display = "none";

    document.querySelector(".chat-btn").style.display = "none";
    document.querySelector(".call-btn").style.display = "none";

    location.reload();
  };
}
</script>

</body>
</html>
