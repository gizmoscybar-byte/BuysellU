<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuySellU - Product Details</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
    }

    .product-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
    }

    .product-image {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin: 15px 0;
    }

    .location {
      color: #555;
      font-size: 16px;
    }

    .seller {
      border-top: 1px solid #ddd;
      margin-top: 20px;
      padding-top: 20px;
    }

    .seller-photo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      vertical-align: middle;
      margin-right: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .chat-btn {
      background: #111;
      color: white;
    }

    .call-btn {
      background: #eee;
      color: #111;
    }

    .back-btn {
      background: white;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>BuySellU</h1>
    <p>Product Details</p>
  </div>

  <div class="container">

    <div class="product-card">

      <img id="productImage" class="product-image" style="display:none;">

      <h2 id="productName">Product</h2>

      <div id="productPrice" class="price"></div>

      <p id="productCategory"></p>

      <p id="productLocation" class="location"></p>

      <p id="productDescription"></p>

      <div class="seller">

        <h3>👤 Seller</h3>

        <div>
          <img id="sellerPhoto" class="seller-photo" style="display:none;">
          <b id="sellerName">Seller</b>
        </div>

        <button class="chat-btn" onclick="openChat()">
          💬 Chat with Seller
        </button>

        <button class="call-btn" onclick="callSeller()">
          📞 Call Seller
        </button>

      </div>

      <button class="back-btn" onclick="window.location.href='index.html'">
        ← Back to Home
      </button>

    </div>

  </div>

  <script>

    const product = JSON.parse(
      localStorage.getItem("buyselluSelectedProduct") || "null"
    );

    if (product) {

      document.getElementById("productName").innerText =
        product.name || "Product";

      document.getElementById("productPrice").innerText =
        "₹" + (product.price || "0");

      document.getElementById("productCategory").innerText =
        "Category: " + (product.category || "Not specified");

      document.getElementById("productLocation").innerText =
        "📍 " + (product.location || "Location not specified");

      document.getElementById("productDescription").innerText =
        product.description || "No description available.";

      if (product.image) {
        const image = document.getElementById("productImage");
        image.src = product.image;
        image.style.display = "block";
      }

    }

    const sellerName =
      localStorage.getItem("buyselluProfileName") || "Unknown Seller";

    const sellerPhoto =
      localStorage.getItem("buyselluProfilePhoto") || "";

    document.getElementById("sellerName").innerText = sellerName;

    if (sellerPhoto) {
      const photo = document.getElementById("sellerPhoto");
      photo.src = sellerPhoto;
      photo.style.display = "inline-block";
    }

    function openChat() {

      localStorage.setItem(
        "buyselluChatSellerName",
        sellerName
      );

      localStorage.setItem(
        "buyselluChatSellerPhoto",
        sellerPhoto
      );

      window.location.href = "chat.html";
    }

    function callSeller() {
      alert("Call feature will be connected with seller phone number next.");
    }

  </script>

</body>
</html>
