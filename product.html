<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuySellU - Product Details</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff3e8;
}

.header{
  background:#f97316;
  color:white;
  padding:18px;
  text-align:center;
}

.container{
  max-width:700px;
  margin:20px auto;
  padding:15px;
}

.product-card{
  background:white;
  border-radius:15px;
  padding:20px;
}

.product-image{
  width:100%;
  max-height:400px;
  object-fit:contain;
  border-radius:12px;
}

.price{
  font-size:28px;
  font-weight:bold;
  margin:15px 0;
}

.location{
  color:#555;
  font-size:16px;
}

.seller{
  border-top:1px solid #ddd;
  margin-top:20px;
  padding-top:20px;
}

.seller-photo{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  vertical-align:middle;
  margin-right:10px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

.favorite-btn{
  background:#111;
  color:white;
  border:1px solid #ff3d00;
  font-size:18px;
}

.chat-btn{
  background:#111;
  color:white;
}

.call-btn{
  background:#eee;
  color:#111;
}

.back-btn{
  background:white;
  border:1px solid #ddd;
}

.more-title{
  margin-top:30px;
  font-size:25px;
}

.more-products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.more-card{
  background:#111;
  color:white;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
}

.more-card img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.more-info{
  padding:10px;
}

.more-info h3{
  margin:0 0 8px;
  font-size:17px;
}

.more-price{
  font-size:19px;
  font-weight:bold;
  color:#ff6a00;
}
</style>
</head>

<body>

<div class="header">
  <h1>BuySellU</h1>
  <p>Product Details</p>
</div>

<div class="container">

<div class="product-card">

<img id="productImage" class="product-image" style="display:none;">

<button id="favoriteBtn" class="favorite-btn" onclick="toggleFavorite()">
♡ Add to Favourite
</button>

<h2 id="productName">Product</h2>

<div id="productPrice" class="price"></div>

<p id="productCategory"></p>

<p id="productLocation" class="location"></p>

<p id="productDescription"></p>

<div class="seller">

<h3>👤 Seller</h3>

<div>
<img id="sellerPhoto" class="seller-photo" style="display:none;">
<b id="sellerName">Seller</b>
</div>

<button class="chat-btn" onclick="openChat()">
💬 Chat with Seller
</button>

<button class="call-btn" onclick="callSeller()">
📞 Call Seller
</button>

</div>

<button class="back-btn" onclick="window.location.href='index.html'">
← Back to Home
</button>

</div>

<h2 class="more-title">More Products</h2>

<div id="moreProducts" class="more-products"></div>

</div>

<script>

const product = JSON.parse(
  localStorage.getItem("buyselluSelectedProduct") || "null"
);

if(product){

  document.getElementById("productName").innerText =
    product.name || "Product";

  document.getElementById("productPrice").innerText =
    "₹" + (product.price || "0");

  document.getElementById("productCategory").innerText =
    "Category: " + (product.category || "Not specified");

  document.getElementById("productLocation").innerText =
    "📍 " + (product.location || "Location not specified");

  document.getElementById("productDescription").innerText =
    product.description || "No description available.";

  if(product.image){

    const image =
      document.getElementById("productImage");

    image.src = product.image;
    image.style.display = "block";
  }
}


/* Seller */

const sellerName =
  localStorage.getItem("buyselluProfileName") ||
  "Unknown Seller";

const sellerPhoto =
  localStorage.getItem("buyselluProfilePhoto") ||
  "";

document.getElementById("sellerName").innerText =
  sellerName;

if(sellerPhoto){

  const photo =
    document.getElementById("sellerPhoto");

  photo.src = sellerPhoto;
  photo.style.display = "inline-block";
}


/* Favourite */

function toggleFavorite(){

  if(!product){
    return;
  }

  let favorites =
    JSON.parse(
      localStorage.getItem("buyselluFavorites") || "[]"
    );

  const index =
    favorites.findIndex(item =>
      JSON.stringify(item) === JSON.stringify(product)
    );

  if(index === -1){

    favorites.push(product);

    document.getElementById("favoriteBtn").innerHTML =
      "❤️ Favourite";

  }else{

    favorites.splice(index,1);

    document.getElementById("favoriteBtn").innerHTML =
      "♡ Add to Favourite";
  }

  localStorage.setItem(
    "buyselluFavorites",
    JSON.stringify(favorites)
  );
}


/* Favourite button status */

if(product){

  const favorites =
    JSON.parse(
      localStorage.getItem("buyselluFavorites") || "[]"
    );

  const isFavorite =
    favorites.some(item =>
      JSON.stringify(item) === JSON.stringify(product)
    );

  if(isFavorite){

    document.getElementById("favoriteBtn").innerHTML =
      "❤️ Favourite";
  }
}


/* Chat */

function openChat(){

  localStorage.setItem(
    "buyselluChatSellerName",
    sellerName
  );

  localStorage.setItem(
    "buyselluChatSellerPhoto",
    sellerPhoto
  );

  window.location.href="chat.html";
}


/* Call */

function callSeller(){

  alert(
    "Call feature will be connected with seller phone number next."
  );
}


/* More Products */

function showMoreProducts(){

  const allListings =
    JSON.parse(
      localStorage.getItem("buyselluListings") || "[]"
    );

  const box =
    document.getElementById("moreProducts");

  box.innerHTML = "";

  const otherProducts =
    allListings
    .filter(item =>
      JSON.stringify(item) !== JSON.stringify(product)
    )
    .slice(0,4);

  otherProducts.forEach(item => {

    const card =
      document.createElement("div");

    card.className="more-card";

    card.onclick=function(){

      localStorage.setItem(
        "buyselluSelectedProduct",
        JSON.stringify(item)
      );

      window.location.href =
        "product.html";
    };

    card.innerHTML = `

      ${
        item.image
        ? `<img src="${item.image}">`
        : ""
      }

      <div class="more-info">

        <h3>${item.name || "Product"}</h3>

        <div class="more-price">
          ₹${item.price || "0"}
        </div>

      </div>
    `;

    box.appendChild(card);
  });
}

showMoreProducts();

</script>

</body>
</html>
