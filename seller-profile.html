<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuySellU - Seller Profile</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

.header{
  background:#111;
  color:white;
  padding:20px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:30px;
}

.profile{
  max-width:650px;
  margin:20px auto;
  background:white;
  border-radius:18px;
  padding:25px;
  text-align:center;
}

.profile-photo{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  border:3px solid #ff3d00;
}

.profile-name{
  font-size:25px;
  font-weight:bold;
  margin-top:15px;
}

.profile-location{
  color:#777;
  margin-top:8px;
  font-size:16px;
}

.profile-details{
  margin-top:20px;
  padding-top:20px;
  border-top:1px solid #ddd;
  text-align:left;
}

.profile-details div{
  padding:10px 0;
}

.products-title{
  max-width:650px;
  margin:25px auto 12px;
  padding:0 10px;
  font-size:23px;
}

.products{
  max-width:650px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:0 10px 20px;
}

.product{
  background:#111;
  color:white;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
}

.product img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.product-info{
  padding:12px;
}

.product-name{
  font-size:17px;
  font-weight:bold;
}

.product-price{
  color:#ff6a00;
  font-size:19px;
  font-weight:bold;
  margin-top:8px;
}

.back-btn{
  display:block;
  max-width:650px;
  margin:10px auto 30px;
  padding:15px;
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  text-align:center;
  font-size:17px;
  cursor:pointer;
}

.empty{
  max-width:650px;
  margin:auto;
  padding:40px 20px;
  text-align:center;
  color:#777;
}

</style>

</head>

<body>

<div class="header">

  <h1>BuySellU</h1>

  <div>👤 Seller Profile</div>

</div>


<div class="profile">

  <img
    id="sellerPhoto"
    class="profile-photo"
    src="https://via.placeholder.com/150"
  >

  <div
    id="sellerName"
    class="profile-name"
  >
    Seller
  </div>

  <div
    id="sellerLocation"
    class="profile-location"
  >
    📍 Location not available
  </div>


  <div class="profile-details">

    <div>
      👤 <b>Seller</b>
    </div>

    <div>
      📦 <b id="productCount">0</b> Products
    </div>

    <div>
      🛒 BuySellU Seller
    </div>

  </div>

</div>


<h2 class="products-title">
  📦 Seller's Products
</h2>


<div id="sellerProducts" class="products"></div>


<div
  class="back-btn"
  onclick="window.history.back()"
>
  ← Back
</div>


<script>

const sellerName =
  localStorage.getItem(
    "buyselluSellerProfileName"
  ) || "Seller";


const sellerPhoto =
  localStorage.getItem(
    "buyselluSellerProfilePhoto"
  ) || "";


document.getElementById(
  "sellerName"
).innerText = sellerName;


if(sellerPhoto){

  document.getElementById(
    "sellerPhoto"
  ).src = sellerPhoto;

}


/* GET SELLER PRODUCTS */

const listings =
  JSON.parse(
    localStorage.getItem(
      "buyselluListings"
    ) || "[]"
  );


/* SHOW UNSOLD PRODUCTS */

const sellerProducts =
  listings.filter(function(item){

    return item.sold !== true;

  });


document.getElementById(
  "productCount"
).innerText =
  sellerProducts.length;


/* LOCATION */

if(sellerProducts.length > 0){

  const location =
    sellerProducts[0].location;

  if(location){

    document.getElementById(
      "sellerLocation"
    ).innerText =
      "📍 " + location;

  }

}


/* SHOW PRODUCTS */

const box =
  document.getElementById(
    "sellerProducts"
  );


if(sellerProducts.length === 0){

  box.innerHTML = `
    <div class="empty">
      📦<br><br>
      This seller has no products yet.
    </div>
  `;

}else{

  sellerProducts.forEach(function(item){

    const card =
      document.createElement("div");

    card.className = "product";


    card.onclick = function(){

      localStorage.setItem(
        "buyselluSelectedProduct",
        JSON.stringify(item)
      );

      window.location.href =
        "product.html";

    };


    card.innerHTML = `

      ${
        item.image
        ?
        `<img src="${item.image}">`
        :
        ""
      }

      <div class="product-info">

        <div class="product-name">
          ${item.name || "Product"}
        </div>

        <div class="product-price">
          ₹${item.price || "0"}
        </div>

      </div>

    `;


    box.appendChild(card);

  });

}

</script>

</body>
</html>
