<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BuySellU - Settings</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff0f7;
  color:#222;
}

.header{
  background:#ec4899;
  color:white;
  padding:25px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:8px 0 0;
  font-size:15px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px 15px;
}

.settings-card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.settings-card button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#f5f5f5;
  font-size:17px;
  text-align:left;
  margin-bottom:10px;
}

.settings-card button:active{
  transform:scale(0.98);
}

.back{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#ec4899;
  color:white;
  font-size:16px;
}
body.dark-mode{
  background:#121212;
  color:white;
}

body.dark-mode .settings-card{
  background:#1e1e1e;
}

body.dark-mode .settings-card button{
  background:#2b2b2b;
  color:white;
}

body.dark-mode .back{
  background:#ec4899;
  color:white;
}
</style>

</head>

<body>

<div class="header">

<h1>BuySellU</h1>

<p>Settings</p>

</div>

<div class="container">

<div class="settings-card">

 <button onclick="window.location.href='notifications.html'">
🔔 Notifications
 </button>

<button onclick="changeLanguage()">
🌐 Language
</button>

<button onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

<button onclick="window.location.href='privacy.html'">
🔒 Privacy
</button>

<button onclick="alert('Password & Security will be connected next.')">
🔐 Password & Security
</button>

</div>

<button class="back"
onclick="window.location.href='account.html'">

← Back to Account

</button>

</div>
<script>
function changeLanguage(){
  const language = prompt(
    "Choose language:\n1. English\n2. Hindi\n3. Urdu"
  );

  if(language === "1"){
    localStorage.setItem("buyselluLanguage","English");
    alert("English selected!");
  }
  else if(language === "2"){
    localStorage.setItem("buyselluLanguage","Hindi");
    alert("Hindi selected!");
  }
  else if(language === "3"){
    localStorage.setItem("buyselluLanguage","Urdu");
    alert("Urdu selected!");
  }
  else{
    alert("Please choose 1, 2 or 3.");
  }
}
    </script>
  <script>
function applyLanguage(){

  const language = localStorage.getItem("buyselluLanguage");

  if(language === "Hindi"){
    document.querySelector("p").innerText = "सेटिंग्स";

    const buttons = document.querySelectorAll(".settings-card button");
    buttons[0].innerText = "🔔 सूचनाएँ";
    buttons[1].innerText = "🌐 भाषा";
    buttons[2].innerText = "🌙 डार्क मोड";
    buttons[3].innerText = "🔒 प्राइवेसी";
    buttons[4].innerText = "🔐 पासवर्ड और सुरक्षा";
  }

  if(language === "Urdu"){
    document.querySelector("p").innerText = "ترتیبات";

    const buttons = document.querySelectorAll(".settings-card button");
    buttons[0].innerText = "🔔 اطلاعات";
    buttons[1].innerText = "🌐 زبان";
    buttons[2].innerText = "🌙 ڈارک موڈ";
    buttons[3].innerText = "🔒 رازداری";
    buttons[4].innerText = "🔐 پاس ورڈ اور سیکیورٹی";
  }
}

applyLanguage();
  </script>
  <script>
function toggleDarkMode(){
  document.body.classList.toggle("dark-mode");

  const enabled = document.body.classList.contains("dark-mode");

  localStorage.setItem("buyselluDarkMode", enabled);

  if(enabled){
    alert("Dark Mode ON");
  }else{
    alert("Dark Mode OFF");
  }
}

if(localStorage.getItem("buyselluDarkMode") === "true"){
  document.body.classList.add("dark-mode");
}
  </script>
</body>
</html>
