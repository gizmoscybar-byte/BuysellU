<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuySellU</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 7px 0 0;
      color: #ccc;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 18px;
    }

    .search {
      width: 100%;
      padding: 15px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .category {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #eee;
      font-size: 16px;
    }

    .sell-btn {
      width: 100%;
      margin-top: 25px;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #sellForm {
      display: none;
      background: white;
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
    }

    #sellForm input,
    #sellForm textarea,
    #sellForm select {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    #sellForm button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  <h1>BuySellU</h1>
  <p>Buy • Sell • Discover</p>
</header>

<div class="container">

  <input class="search" type="text" placeholder="Search for products...">

  <div class="categories">
    <div class="category">📱 Mobiles</div>
    <div class="category">💻 Electronics</div>
    <div class="category">🚗 Cars</div>
    <div class="category">🏍️ Bikes</div>
    <div class="category">👕 Fashion</div>
    <div class="category">🏠 Home</div>
  </div>

  <button class="sell-btn" onclick="showSellForm()">
    ＋ Sell Something
  </button>

  <div id="sellForm">
    <h2>Sell Something</h2>

    <input type="text" placeholder="Product name">

    <select>
      <option>Select category</option>
      <option>Mobiles</option>
      <option>Electronics</option>
      <option>Cars</option>
      <option>Bikes</option>
      <option>Fashion</option>
      <option>Home</option>
    </select>

    <input type="number" placeholder="Price">

    <input type="text" placeholder="Location">

    <textarea rows="4" placeholder="Describe your product"></textarea>

    <input type="file" accept="image/*">

    <button onclick="alert('Your listing is ready!')">
      Post Listing
    </button>
  </div>

</div>

<script>
  function showSellForm() {
    document.getElementById("sellForm").style.display = "block";
    window.scrollTo({
      top: document.getElementById("sellForm").offsetTop,
      behavior: "smooth"
    });
  }
</script>

</body>
</html>
