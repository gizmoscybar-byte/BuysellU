<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuySellU</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:22px;
  text-align:center;
}

header h1{margin:0;font-size:30px}
header p{margin:7px 0 0;color:#ccc}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 18px;
}

.search{
  width:100%;
  padding:15px;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:20px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.category{
  background:white;
  padding:20px;
  border-radius:12px;
  text-align:center;
  border:1px solid #eee;
}

.sell-btn{
  width:100%;
  margin-top:25px;
  padding:17px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:18px;
}

#sellForm{
  display:none;
  background:white;
  margin-top:25px;
  padding:20px;
  border-radius:12px;
}

#sellForm input,
#sellForm textarea,
#sellForm select{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

#sellForm button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
  font-size:16px;
}

#listings{
  margin-top:30px;
}

.listing{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
  border:1px solid #eee;
}

.listing img{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:10px;
}

.price{
  font-size:20px;
  font-weight:bold;
}

.location{
  color:#666;
}
</style>
</head>

<body>

<header>
<h1>BuySellU</h1>
<p>Buy • Sell • Discover</p>
</header>

<div class="container">

<input
class="search"
id="search"
type="text"
placeholder="Search for products..."
oninput="searchListings()">

<div class="categories">
<div class="category">📱 Mobiles</div>
<div class="category">💻 Electronics</div>
<div class="category">🚗 Cars</div>
<div class="category">🏍️ Bikes</div>
<div class="category">👕 Fashion</div>
<div class="category">🏠 Home</div>
</div>

<button class="sell-btn" onclick="showSellForm()">
＋ Sell Something
</button>
<button class="sell-btn" onclick="showLoginForm()">
👤 Login / Sign Up
</button>
  <div id="loginForm" style="display:none; background:white; margin-top:25px; padding:20px; border-radius:12px;">

  <h2>Login / Sign Up</h2>

  <input id="email" type="email" placeholder="Email address"
    style="width:100%; box-sizing:border-box; padding:13px; margin:8px 0;">

  <input id="password" type="password" placeholder="Password"
    style="width:100%; box-sizing:border-box; padding:13px; margin:8px 0;">

  <button onclick="loginUser()"
    style="width:100%; padding:14px; margin-top:10px;">
    Login
  </button>

  <button onclick="signupUser()"
    style="width:100%; padding:14px; margin-top:10px;">
    Create Account
  </button>

  </div>
<div id="sellForm">

<h2>Sell Something</h2>

<input id="productName" type="text" placeholder="Product name">

<select id="category">
<option value="">Select category</option>
<option>Mobiles</option>
<option>Electronics</option>
<option>Cars</option>
<option>Bikes</option>
<option>Fashion</option>
<option>Home</option>
</select>

<input id="price" type="number" placeholder="Price">

<input id="location" type="text" placeholder="Location">

<textarea id="description" rows="4"
placeholder="Describe your product"></textarea>

<label for="photo" class="photo-btn">📷 Add Photo</label>
<input id="photo" type="file" accept="image/*" style="display:none;">
<button onclick="postListing()">Post Listing</button>

</div>

<div id="listings"></div>

</div>

<script>

let listings = JSON.parse(localStorage.getItem("buyselluListings")) || [];

function showSellForm(){
  document.getElementById("sellForm").style.display="block";
  document.getElementById("sellForm").scrollIntoView({
    behavior:"smooth"
  });
}

function postListing(){

  const name=document.getElementById("productName").value.trim();
  const category=document.getElementById("category").value;
  const price=document.getElementById("price").value;
  const location=document.getElementById("location").value.trim();
  const description=document.getElementById("description").value.trim();
  const photo=document.getElementById("photo").files[0];

  if(!name || !category || !price || !location){
    alert("Please fill all required details.");
    return;
  }

  const saveListing=(image="")=>{

    listings.unshift({
      name,
      category,
      price,
      location,
      description,
      image
    });

    localStorage.setItem(
      "buyselluListings",
      JSON.stringify(listings)
    );

    displayListings();

    document.getElementById("productName").value="";
    document.getElementById("category").value="";
    document.getElementById("price").value="";
    document.getElementById("location").value="";
    document.getElementById("description").value="";
    document.getElementById("photo").value="";

    alert("Listing posted successfully!");
  };

  if(photo){

    const reader=new FileReader();

    reader.onload=function(e){
      saveListing(e.target.result);
    };

    reader.readAsDataURL(photo);

  }else{
    saveListing();
  }
}

function displayListings(){

  const box=document.getElementById("listings");

  if(listings.length===0){
    box.innerHTML="";
    return;
  }

  box.innerHTML="<h2>Latest Listings</h2>";

  listings.forEach(item=>{

    const card=document.createElement("div");

    card.className="listing";

    card.innerHTML=`
      ${item.image ? `<img src="${item.image}">` : ""}
      <h3>${item.name}</h3>
      <div class="price">₹${item.price}</div>
      <p><b>${item.category}</b></p>
      <p class="location">📍 ${item.location}</p>
      <p>${item.description}</p>
    `;

    box.appendChild(card);
  });
}

function searchListings(){

  const search=
    document.getElementById("search").value.toLowerCase();

  document.querySelectorAll(".listing").forEach(card=>{

    card.style.display=
      card.innerText.toLowerCase().includes(search)
      ? "block"
      : "none";

  });
}

displayListings();

</script>
<script>
function showLoginForm() {
  const form = document.getElementById("loginForm");

  if (form.style.display === "none" || form.style.display === "") {
    form.style.display = "block";
  } else {
    form.style.display = "none";
  }
}

function loginUser() {
  alert("Login system will be connected next.");
}

function signupUser() {
  alert("Account creation system will be connected next.");
}
</script>
  <div id="profileSection" style="display:none; background:white; margin-top:25px; padding:20px; border-radius:12px;">

  <h2>👤 My Profile</h2>
<label for="profilePhoto" style="display:block; margin-top:15px;">
  📷 Profile Photo
</label>

<input id="profilePhoto" type="file" accept="image/*" style="margin-top:8px;">
    <img id="profilePreview"
     style="display:none; width:100px; height:100px; object-fit:cover; border-radius:50%; margin-top:15px;">
  <input id="profileName" type="text" placeholder="Your Name"
    style="width:100%; box-sizing:border-box; padding:13px; margin:8px 0;">

  <input id="profileLocation" type="text" placeholder="Your Location"
    style="width:100%; box-sizing:border-box; padding:13px; margin:8px 0;">

  <button onclick="saveProfile()"
    style="width:100%; padding:14px; margin-top:10px;">
    💾 Save Profile
  </button>

</div>

<button onclick="showProfile()"
  style="width:100%; padding:14px; margin-top:15px;">
  👤 My Profile
</button>

<script>
function showProfile() {
  const profile = document.getElementById("profileSection");

  if (profile.style.display === "none" || profile.style.display === "") {
    profile.style.display = "block";
  } else {
    profile.style.display = "none";
  }
}

function saveProfile() {
  const name = document.getElementById("profileName").value;
  const location = document.getElementById("profileLocation").value;

  localStorage.setItem("buyselluProfileName", name);
  localStorage.setItem("buyselluProfileLocation", location);

  alert("Profile saved successfully!");
}
  document.getElementById("profilePhoto").addEventListener("change", function(event) {
  const file = event.target.files[0];

  if (file) {
    const reader = new FileReader();

    reader.onload = function(e) {
      const preview = document.getElementById("profilePreview");
      preview.src = e.target.result;
      preview.style.display = "block";
    };

    reader.readAsDataURL(file);
  }
});
</script>
</body>
</html>ka.
