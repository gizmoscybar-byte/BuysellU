<div id="sellForm">

<h2>Sell Something</h2>

<option value="">Select category</option>

placeholder="Describe your product"></textarea>

<script>

let listings = JSON.parse(localStorage.getItem("buyselluListings")) || [];

function showSellForm(){
  document.getElementById("sellForm").style.display="block";
  document.getElementById("sellForm").scrollIntoView({
    behavior:"smooth"
  });
}

function postListing(){

  const name=document.getElementById("productName").value.trim();
  const category=document.getElementById("category").value;
  const price=document.getElementById("price").value;
  const location=document.getElementById("location").value.trim();
  const description=document.getElementById("description").value.trim();
  const photo=document.getElementById("photo").files[0];

  if(!name || !category || !price || !location){
    alert("Please fill all required details.");
    return;
  }

  const saveListing=(image="")=>{

    listings.unshift({
      name,
      category,
      price,
      location,
      description,
      image
    });

    localStorage.setItem(
      "buyselluListings",
      JSON.stringify(listings)
    );

    displayListings();

    document.getElementById("productName").value="";
    document.getElementById("category").value="";
    document.getElementById("price").value="";
    document.getElementById("location").value="";
    document.getElementById("description").value="";
    document.getElementById("photo").value="";

    alert("Listing posted successfully!");
  };

  if(photo){

  const reader = new FileReader();

  reader.onload = function(e){

    const img = new Image();

    img.onload = function(){

      const canvas = document.createElement("canvas");
      const maxWidth = 800;
      const scale = Math.min(1, maxWidth / img.width);

      canvas.width = img.width * scale;
      canvas.height = img.height * scale;

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const compressedImage =
        canvas.toDataURL("image/jpeg", 0.7);

      saveListing(compressedImage);
    };

    img.src = e.target.result;
  };

  reader.readAsDataURL(photo);

}else{
  saveListing();
  }
}

function displayListings(){

  const box=document.getElementById("listings");

  if(listings.length===0){
    box.innerHTML="";
    return;
  }

  box.innerHTML="<h2>Latest Listings</h2>";

  listings.forEach(item=>{

    const card=document.createElement("div");
card.onclick=function(event){
  if(event.target.tagName==="BUTTON"){
    return;
  }

  localStorage.setItem(
    "buyselluSelectedProduct",
    JSON.stringify(item)
  );

  window.location.href="product.html";
};
    card.className="listing";

    card.innerHTML=`
  ${item.image ? `<img src="${item.image}">` : ""}
  <h3>${item.name}</h3>
  <div class="price">₹${item.price}</div>
`;

    box.appendChild(card);
  });
}
function contactSeller(){
  alert("Contact Seller feature will be connected next.");
}

function chatSeller(){
  const sellerName =
    localStorage.getItem("buyselluProfileName") || "Unknown Seller";

  const sellerPhoto =
    localStorage.getItem("buyselluProfilePhoto") || "";

  localStorage.setItem("buyselluChatSellerName", sellerName);
  localStorage.setItem("buyselluChatSellerPhoto", sellerPhoto);

  window.location.href = "chat.html";
}
  function filterCategory(category){

  const cards = document.querySelectorAll(".listing");

  cards.forEach(card => {

    const product =
      listings.find(item =>
        card.innerText.includes(item.name)
      );

    if(product && product.category === category){
      card.style.display = "block";
    }else{
      card.style.display = "none";
    }

  });

  }
function searchListings(){

  const search =
    document.getElementById("search").value.toLowerCase().trim();

  document.querySelectorAll(".listing").forEach(card => {

    const text = card.innerText.toLowerCase();

    card.style.display =
      text.includes(search)
      ? "block"
      : "none";

  });

}

displayListings();

</script>
<script>
  function showLoginOptions() {
  const box = document.getElementById("loginOptions");

  if (box.style.display === "none" || box.style.display === "") {
    box.style.display = "block";
  } else {
    box.style.display = "none";
  }
  }
function showLoginForm() {
  const form = document.getElementById("loginForm");

  if (form.style.display === "none" || form.style.display === "") {
    form.style.display = "block";
  } else {
    form.style.display = "none";
  }
}

async function loginUser() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Email and password enter karo.");
    return;
  }

  try {
    const { getAuth, signInWithEmailAndPassword } =
      await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js");

    const auth = getAuth();

    await signInWithEmailAndPassword(auth, email, password);

    alert("Login successful!");
  } catch (error) {
    alert("Login failed: " + error.message);
  }
}

async function signupUser() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Email and password enter karo.");
    return;
  }

  try {
    const { getAuth, createUserWithEmailAndPassword } =
      await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js");

    const auth = getAuth();

    await createUserWithEmailAndPassword(auth, email, password);

    alert("Account created successfully!");
  } catch (error) {
    alert("Sign up failed: " + error.message);
  }
}
</script>

<script>
function showProfile() {
  const profile = document.getElementById("profileSection");

  if (profile.style.display === "none" || profile.style.display === "") {
    profile.style.display = "block";
  } else {
    profile.style.display = "none";
  }
}

function saveProfile() {
  const name = document.getElementById("profileName").value;
  const location = document.getElementById("profileLocation").value;
  const preview = document.getElementById("profilePreview");
const phone = document.getElementById("profilePhone").value;
const email = document.getElementById("profileEmail").value;
  if (preview.src && preview.style.display !== "none") {
    localStorage.setItem("buyselluProfilePhoto", preview.src);
  }
  localStorage.setItem("buyselluProfileName", name);
  localStorage.setItem("buyselluProfileLocation", location);
localStorage.setItem("buyselluProfilePhone", phone);
localStorage.setItem("buyselluProfileEmail", email);
displayListings();
  alert("Profile saved successfully!");
}
  document.getElementById("profileName").value =
  localStorage.getItem("buyselluProfileName") || "";
  document.getElementById("profilePhoto").addEventListener("change", function(event) {
  const file = event.target.files[0];

  if (file) {
    const reader = new FileReader();

    reader.onload = function(e) {
      const preview = document.getElementById("profilePreview");
      preview.src = e.target.result;
      preview.style.display = "block";
    };

    reader.readAsDataURL(file);
  }
});
</script>
