<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BuySellU - Account</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff0f7;
  color:#222;
}

.header{
  background:#ec4899;
  color:white;
  padding:25px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:8px 0 0;
  font-size:15px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px 15px;
}

.account-card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.account-card button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#f5f5f5;
  font-size:17px;
  text-align:left;
}

.account-card button:active{
  transform:scale(0.98);
}

.logout{
  background:#111 !important;
  color:white;
  text-align:center !important;
}

.back{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#ec4899;
  color:white;
  font-size:16px;
  margin-top:10px;
}

</style>

</head>

<body>

<div class="header">

<h1>BuySellU</h1>

<p>My Account</p>

</div>

<div class="container">
<p id="userEmail" style="text-align:center;"></p>
<div class="account-card">

<button onclick="window.location.href='my-profile.html'">
👤 My Profile
</button>

</div>

<div class="account-card">

<button onclick="window.location.href='my-listings.html'">
📦 My Listings
</button>

</div>

<div class="account-card">

<button onclick="window.location.href='saved.html'">
❤️ Saved / Favourite Items
</button>

</div>

<div class="account-card">

<button onclick="window.location.href='chat.html'">
💬 My Chats
</button>

</div>

<div class="account-card">

<button onclick="window.location.href='notifications.html'">
🔔 Notifications
</button>

</div>

<div class="account-card">

<button onclick="window.location.href='settings.html'">
⚙️ Settings
</button>

</div>

<div class="account-card">

<button onclick="window.location.href='help.html'">
❓ Help & Support
</button>

</div>
<div class="account-card">

<button onclick="window.location.href='privacy-settings.html'">
🔒 Privacy
</button>

</div>
<div class="account-card">
<button id="logoutBtn" class="logout" onclick="logoutUser()" style="display:none;">
🔐 Login / Logout
</button>
</div>


<button class="back"
onclick="window.location.href='index.html'">

← Back to Home

</button>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  initializeAuth,
  browserPopupRedirectResolver,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyCXE8VXsK9olIImXh_XdvXVqXt-IKzaqRk",
  authDomain: "buysellu-d4db0.firebaseapp.com",
  projectId: "buysellu-d4db0",
  storageBucket: "buysellu-d4db0.firebasestorage.app",
  messagingSenderId: "585565834703",
  appId: "1:585565834703:web:724ad291b435df758356ba",
  measurementId: "G-JSV2BLP6HL"
};

const app = initializeApp(firebaseConfig);
const auth = initializeAuth(app, {
  persistence: browserLocalPersistence,
  popupRedirectResolver: browserPopupRedirectResolver
});

setPersistence(auth, browserLocalPersistence)
  .then(() => {

    onAuthStateChanged(auth, (user) => {

      const userEmail = document.getElementById("userEmail");

      if (user) {
        console.log("Logged in:", user.email);

        userEmail.textContent = "Logged in as: " + user.email;
document.getElementById("logoutBtn").style.display = "block";
      } else {
        console.log("Not logged in");

        userEmail.textContent = "Not logged in";
        document.getElementById("logoutBtn").style.display = "none";
      }

    });

  })
  .catch((error) => {
    console.error("Firebase error:", error);
  });

window.logoutUser = async function() {

  try {

    await signOut(auth);

    alert("Logout successful!");

    window.location.href = "index.html";

  } catch (error) {

    alert("Logout failed: " + error.message);

  }

};
</script>
</body>
</html>
