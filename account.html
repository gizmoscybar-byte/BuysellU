<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BuySellU - Account</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff0f7;
  color:#222;
}

.header{
  background:#ec4899;
  color:white;
  padding:25px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:8px 0 0;
  font-size:15px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px 15px;
}

.account-card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.account-card button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#f5f5f5;
  font-size:17px;
  text-align:left;
}

.account-card button:active{
  transform:scale(0.98);
}

.logout{
  background:#111 !important;
  color:white;
  text-align:center !important;
}

.back{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#ec4899;
  color:white;
  font-size:16px;
  margin-top:10px;
}

</style>

</head>

<body>

<div class="header">

<h1>BuySellU</h1>

<p>My Account</p>

</div>

<div class="container">

<div class="account-card">

<button onclick="window.location.href='my-profile.html'">
👤 My Profile
</button>

</div>

<div class="account-card">

<button onclick="window.location.href='my-listings.html'">
📦 My Listings
</button>

</div>

<div class="account-card">

<button>
❤️ Saved / Favourite Items
</button>

</div>

<div class="account-card">

<button onclick="window.location.href='chat.html'">
💬 My Chats
</button>

</div>

<div class="account-card">

<button>
🔔 Notifications
</button>

</div>

<div class="account-card">

<button onclick="window.location.href='settings.html'">
⚙️ Settings
</button>

</div>

<div class="account-card">

<button>
❓ Help & Support
</button>

</div>
<div class="account-card">

<button onclick="window.location.href='privacy.html'">
🔒 Privacy
</button>

</div>
<div class="account-card">

<button class="logout">
🔐 Login / Logout
</button>

</div>

<button class="back"
onclick="window.location.href='index.html'">

← Back to Home

</button>

</div>

</html>
